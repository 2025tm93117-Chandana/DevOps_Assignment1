name: Flask CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip flake8 && pip install -r requirements.txt
      - name: Compile sources
        run: python -m compileall -q app.py tests Code_Versions
      - name: Lint (syntax errors, undefined names, unused imports)
        run: flake8 app.py tests --count --select=E9,F63,F7,F82,F401,F841 --show-source --statistics

  docker-test:
    name: Docker Build & Test
    needs: build-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --tag aceest-fitness:${{ github.sha }} .
      - name: Run Pytest inside the container
        run: docker run --rm --entrypoint python aceest-fitness:${{ github.sha }} -m pytest -q
